<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suối Tiên VR360 — Popup v2: VR Wall + Infinite Slider</title>

<!-- ══════════════════════════════════════════════════════════════════════
     PHƯƠNG ÁN 2 — VR WALL + INFINITE SLIDER  (note.md §137 · D-50)

         VR WALL tổng quan  →  INFINITE SLIDER khám phá  →  VR 360 chi tiết

     Đây là bản THỨ HAI để khách so sánh, KHÔNG thay thế `index.html`
     (bản 1 = màn chào + 3D carousel). Hai bản dùng chung `js/bridge.js`
     nên trang cha chỉ cần đổi `src` của iframe, không sửa dòng code nào.

     Nhúng y hệt bản 1 — xem docs/07-integration.md:
         <iframe src=".../index2.html?lang=vi"
                 style="position:fixed;inset:0;width:100%;height:100%;
                        border:0;background:transparent;z-index:10050"></iframe>

     Mở thẳng file này bằng double-click cũng chạy (bridge thành no-op).
     ══════════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arima+Madurai:wght@400;500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/wall.css">
<link rel="stylesheet" href="css/slider.css">
<link rel="stylesheet" href="css/map2d.css">
<link rel="stylesheet" href="css/responsive2.css">
</head>
<body>

<!-- Sprite icon inline — 8 icon (bản 1 dùng 5, bản này thêm i-vr, i-search, i-chevrons-left).
     `<use href="file.svg#id">` bị CORS chặn khi mở file:// nên phải inline. -->
<svg id="st-icons" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
<defs>
<g id="i-close" transform="translate(0.05 0.05)"><path d="M6 6l12 12M18 6L6 18"/></g>
<g id="i-chevron-left"><path d="m15 6-6 6 6 6"/></g>
<g id="i-chevron-right"><path d="m9 6 6 6-6 6"/></g>
<g id="i-arrow-right" transform="translate(0.5 0)"><path d="M4 12h15m-6-6 6 6-6 6"/></g>
<g id="i-arrow-left" transform="translate(-0.5 0)"><path d="M20 12H5m6-6-6 6 6 6"/></g>
<g id="i-search" transform="translate(0.1 0.1)"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></g>
<g id="i-vr" transform="translate(0.05 -0.15)"><rect x="2.5" y="7.5" width="19" height="9" rx="3.2"/><path d="M9.6 16.5 12 13.4l2.4 3.1"/><circle cx="7" cy="12" r="1"/><circle cx="17" cy="12" r="1"/></g>
<g id="i-map" transform="translate(0.05 -0.06)"><path d="M9 20 3 17.5v-13L9 7l6-2.5 6 2.5v13L15 17Z"/><path d="M9 7v13M15 4.5v13"/><circle cx="12" cy="11" r="1.6"/></g>
<g id="i-plus"><path d="M12 5.2v13.6M5.2 12h13.6"/></g>
<g id="i-minus"><path d="M5.2 12h13.6"/></g>
<g id="i-expand" transform="translate(0.05 0.05)"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g>
<g id="i-star" fill="currentColor" stroke="none"><path d="M12 3.4l2.63 5.33 5.88.86-4.25 4.15 1 5.86L12 16.83l-5.26 2.77 1-5.86L3.5 9.59l5.88-.86Z"/></g>
</defs>
</svg>


<div id="st-pop2" role="dialog" aria-modal="true" aria-labelledby="st-wall-title">

  <span class="st-brandline" aria-hidden="true"></span>

  <button class="st-p2-close" type="button" data-st-close data-i18n-aria="close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
  </button>

  <!-- ══════════════════════════════════════════════════════════════════
       TRẠNG THÁI 1 — VR WALL: 9 ô cảnh động, mỗi ô là một KHU VỰC.
       Ô do js/wall.js sinh từ D.GROUPS; đây chỉ là bộ khung.
       ══════════════════════════════════════════════════════════════════ -->
  <section class="st-wall" id="st-wall">

    <header class="st-wall-head">
      <span class="st-eyebrow" data-i18n="wall.eyebrow"></span>
      <h1 id="st-wall-title" tabindex="-1" data-i18n="wall.title"></h1>
      <p id="st-wall-sub" data-i18n="wall.subtitle"></p>
    </header>

    <div class="st-wall-grid" id="st-wall-grid"
         role="group" data-i18n-aria="wall.gridLabel"></div>

    <!-- Thanh công cụ (note.md §198). Đã bỏ 2 mục so với note:
         · "Xem bản đồ"          — bản đồ đã gỡ từ D-44, không có gì để mở
         · "Khám phá theo chủ đề" — chính là cái wall đang hiện, tự trỏ vào mình -->
    <nav class="st-wall-bar">
      <button type="button" data-act="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <span data-i18n="wall.search"></span>
      </button>
      <!-- <button type="button" data-open-map="all">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map"/></svg>
        <span data-i18n="map.open"></span>
      </button> -->
      <button type="button" class="st-primary" data-act="journey">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
        <span data-i18n="wall.journey"></span>
      </button>
      <button type="button" class="st-ghost" data-act="skip">
        <span data-i18n="wall.skip"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-right"/></svg>
      </button>
    </nav>
  </section>

  <!-- ══════════════════════════════════════════════════════════════════
       TRẠNG THÁI 2 — INFINITE SLIDER: một điểm gần trọn màn, hai bên hé lộ
       điểm trước/sau. Panel + chip do js/slider.js sinh.
       ══════════════════════════════════════════════════════════════════ -->
  <section class="st-sld" id="st-sld" hidden aria-hidden="true">

    <div class="st-sld-bg" aria-hidden="true"></div>

    <div class="st-sld-top">
      <button type="button" class="st-sld-back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-left"/></svg>
        <span data-i18n="slider.back"></span>
      </button>

      <div class="st-sld-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" autocomplete="off"
               data-i18n-aria="slider.searchLabel"
               data-i18n-ph="slider.searchPh">
        <button type="button" class="st-sld-clear" data-i18n-aria="slider.clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
    </div>

    <div class="st-sld-stage">
      <div class="st-sld-track" role="group" aria-roledescription="carousel"
           data-i18n-aria="slider.trackLabel"></div>

      <p class="st-sld-empty" hidden data-i18n="slider.empty"></p>

      <button class="st-sld-nav st-sld-prev" type="button" data-sld-nav="prev"
              data-i18n-aria="slider.prev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg>
      </button>
      <button class="st-sld-nav st-sld-next" type="button" data-sld-nav="next"
              data-i18n-aria="slider.next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
    </div>

    <div class="st-sld-bot">
      <div class="st-sld-chips"></div>
      <button type="button" class="st-sld-map" data-open-map="area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-map"/></svg>
        <span data-i18n="map.openArea"></span>
      </button>
      <span class="st-sld-counter"></span>
    </div>

    <p class="st-sld-live st-sr-only" aria-live="polite"></p>
  </section>
</div>

<div id="st-map" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="st-map-top">
    <div class="st-map-head">
      <span class="st-map-sub" data-i18n="map.sub"></span>
      <span class="st-map-title"></span>
    </div>
    <span class="st-map-count"></span>
    <button type="button" class="st-map-x" data-map-act="close" data-i18n-aria="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>

  <div class="st-map-view">
    <div class="st-map-canvas">
      <img class="st-map-img" alt="" decoding="async">
      <div class="st-map-pins"></div>
    </div>

    <div class="st-map-card" hidden></div>

    <div class="st-map-tools">
      <button type="button" class="st-map-fit" data-map-act="fit" data-i18n-aria="map.fit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-expand"/></svg>
      </button>
      <button type="button" data-map-act="in" data-i18n-aria="map.zoomIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
      <button type="button" data-map-act="out" data-i18n-aria="map.zoomOut">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-minus"/></svg>
      </button>
    </div>

    <p class="st-map-hint" data-i18n="map.hint"></p>
  </div>
</div>

<div id="st-debug" hidden></div>


<!-- ══ JS ══════════════════════════════════════════════════════════════════
     Dùng lại nguyên `data.js` · `i18n.js` · `a11y.js` · `bridge.js` của bản 1.
     Riêng phần hiển thị là 3 file mới: wall → slider → popup2 (cuối cùng). -->
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/a11y.js"></script>
<script src="js/bridge.js"></script>
<script src="js/map2d.js"></script>
<script src="js/wall.js"></script>
<script src="js/slider.js"></script>
<script src="js/popup2.js"></script>
</body>
</html>
