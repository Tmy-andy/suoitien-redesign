     ══════════════════════════════════════════════════════════════════════ -->
<div id="st-route" class="st-modal st-fs" aria-hidden="true">
  <div class="st-fs-panel" role="dialog" aria-modal="true" aria-labelledby="st-route-title">

    <!-- ── Bảng điều khiển trái ─────────────────────────────────────────── -->

        </button>
      </div>

      <div class="st-rt-scroll">
        <div class="st-rt-card">
          <!-- Ray trái: chấm xanh · nét đứt · ô vuông đỏ (chi tiết nhận diện) -->
          <span class="st-rt-rail" aria-hidden="true">
            <i class="st-rt-dot"></i><i class="st-rt-dash"></i><i class="st-rt-sq"></i>
          </span>
          <div class="st-rt-fields">
            <label class="st-rt-field">
              <span class="st-rt-lab" data-i18n="route.from"></span>
              <span class="st-rt-sel">
                <select id="st-rt-from"></select>
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-down"/></svg>
              </span>
            </label>
            <label class="st-rt-field">
              <span class="st-rt-lab" data-i18n="route.to"></span>
              <span class="st-rt-sel">
                <select id="st-rt-to"></select>
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-down"/></svg>
              </span>
            </label>
          </div>
          <div class="st-rt-acts">
            <button id="st-rt-swap" class="st-rt-btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-swap"/></svg>
              <span data-i18n="route.swap"></span>

            <button id="st-rt-mine" class="st-rt-btn st-rt-tonal" type="button">

              <span data-i18n="route.myLoc"></span>

        </div>

        <ol id="st-rt-steps"></ol>

        <p class="st-rt-mock" data-i18n="route.mock"></p>
      </div>
    </aside>

    <!-- ── Bản đồ ───────────────────────────────────────────────────────── -->
    <div class="st-rt-stage">
      <div id="st-rt-canvas">
        <!-- MOCK: bản đồ SVG tự vẽ. Bản thật là map/img/map.jpg (~1.2 MB) —
             thay <svg> này bằng <img> là xong, toạ độ pin tính theo % nên
             không phải sửa JS. Gradient dùng id riêng `stRt*` để không đụng
             defs của bản đồ trong modal welcome. -->
        <svg class="st-rt-map" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="stRtGrass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f2fbf5"/><stop offset="1" stop-color="#d8f0e0"/>
            </linearGradient>
            <linearGradient id="stRtWater" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d5edf9"/><stop offset="1" stop-color="#aedaef"/>

            <linearGradient id="stRtBldA" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b3e2c4"/><stop offset="1" stop-color="#86cd9f"/>
            </linearGradient>
            <linearGradient id="stRtBldB" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f8e8b6"/><stop offset="1" stop-color="#ecd07a"/>

<div id="st-places" class="st-modal st-fs" aria-hidden="true">
  <div class="st-fs-panel" role="dialog" aria-modal="true" aria-labelledby="st-places-title">
    <div class="st-pl-head">
      <h2 id="st-places-title" tabindex="-1" data-i18n="places.title"></h2>
      <span class="st-pl-searchwrap">
        <svg class="st-pl-searchic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="st-pl-search" type="text" autocomplete="off" spellcheck="false">
        <button id="st-pl-clear" type="button" hidden data-i18n-aria="places.clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </span>
      <button class="st-fs-close st-pl-x" type="button" data-st-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>

    <div id="st-pl-grid"></div>
    <p id="st-pl-empty" hidden data-i18n="places.empty"></p>

  </div>
</div>
